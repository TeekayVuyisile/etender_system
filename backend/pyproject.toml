[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors & pyflakes, I: import sorting, B: common bugs, UP: modern Python syntax
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make ruff treat alembic as first-party
known-third-party = ["alembic"]
