# Render Blueprint: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------------------
  # The API: FastAPI in Docker, built from backend/Dockerfile (the same image CI builds).
  # ---------------------------------------------------------------------------------------
  - type: web
    name: tender-insight-hub-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # The free plan has no pre-deploy step, so start.sh runs migrations before the API starts.
    dockerCommand: sh start.sh
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      # sync: false values are secrets, entered in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: tender_insight_hub
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEMO_MODE_ENABLED
        value: "true"
      # The sync runs from GitHub Actions (.github/workflows/scheduled-jobs.yml).
      - key: SYNC_SCHEDULE_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: '["https://tender-insight-hub.onrender.com"]'
      - key: FORWARDED_ALLOW_IPS
        value: "*"

  # ---------------------------------------------------------------------------------------
  # The frontend: the React build, served as static files from Render's CDN.
  # ---------------------------------------------------------------------------------------
  - type: web
    name: tender-insight-hub
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    # Forward the API to the API service (like nginx.conf in Docker); everything else is the SPA.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://tender-insight-hub-api.onrender.com/api/*
      - type: rewrite
        source: /docs
        destination: https://tender-insight-hub-api.onrender.com/docs
      - type: rewrite
        source: /openapi.json
        destination: https://tender-insight-hub-api.onrender.com/openapi.json
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
