# Scheduled jobs for production, where the API sleeps when idle and there's no always-on
# worker: tender sync every 6 hours, reminders and demo upkeep hourly (UTC).
name: Scheduled jobs

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "47 */6 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [sync-tenders, hourly-jobs]
        default: sync-tenders

concurrency:
  group: scheduled-jobs
  cancel-in-progress: false

jobs:
  run:
    name: Run scheduled job
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MONGODB_URL: ${{ secrets.MONGODB_URL }}
      MONGODB_DB_NAME: tender_insight_hub
      REDIS_URL: ${{ secrets.REDIS_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DEMO_MODE_ENABLED: "true"

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync tenders
        if: github.event.schedule == '47 */6 * * *' || inputs.job == 'sync-tenders'
        # The sync also refreshes the Redis cache, by bumping the tenders version.
        run: python -m app.cli sync-tenders --days 3

      - name: Send reminders and run demo upkeep
        if: github.event.schedule == '17 * * * *' || inputs.job == 'hourly-jobs'
        run: python -m app.cli hourly-jobs
